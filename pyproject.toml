[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myaichatbot"
version = "0.1.0"
description = "An AI-powered chatbot for development assistance"
readme = "README.md"
authors = [
    {name = "Kumaresan Lakshmanan", email = "kaymatrix@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "ollama>=0.1.0",
    "kpylib>=0.1.0",
]

[project.scripts]
myaichatbot = "myaichatbot.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/myaichatbot"
"Bug Reports" = "https://github.com/yourusername/myaichatbot/issues"
"Source" = "https://github.com/yourusername/myaichatbot"

[tool.setuptools.packages.find]
where = ["."]
include = ["myaichatbot*"]

[tool.setuptools.package-data]
myaichatbot = ["config.json"]